name: Release
on:
  release: { types: [published] }
permissions:
  contents: write
  id-token: write   # required for npm provenance
jobs:
  publish:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", registry-url: "https://registry.npmjs.org" }
      - run: npm ci
      - run: npm run build
      # A tagged release must clear the same gates as any push (DESIGN.md §7.3):
      # the injection suite is the security bottom line and must never be bypassed.
      - name: Static injection guard
        run: npm run lint
      - name: Full test suite
        run: npm test
      - name: Dependency audit
        run: npm run audit
      - name: Publish with provenance
        run: npm publish --provenance --access public
        env: { NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} }
      # SBOM generation runs AFTER publish and with a pinned version: an
      # unpinned `npx` would execute freshly-resolved third-party code inside a
      # job holding NODE_AUTH_TOKEN and id-token: write, and doing it before
      # publish would let that code tamper with dist/ and still receive a valid
      # provenance attestation (DESIGN.md §5.2).
      - name: Generate SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.0 --output-file sbom.json
      - name: Attach SBOM to release
        uses: softprops/action-gh-release@v2
        with: { files: sbom.json }
