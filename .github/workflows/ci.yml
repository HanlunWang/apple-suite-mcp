name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build-test:
    runs-on: macos-14   # native EventKit/Contacts + integration need macOS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }   # node:test runs TS directly (>= 22.6)
      - run: npm ci
      - name: Typecheck + build (TS + Swift helper)
        run: npm run build
      - name: Helper protocol smoke (no TCC needed)
        run: |
          for helper in eventkit-helper contacts-helper; do
            printf '%s\n' '{"id":1,"op":"ping"}' \
              | "./native/${helper}/.build/release/${helper}" --json-stdin \
              | grep -q '"pong":true'
          done
          printf '{"id":1,"op":"ping"}' \
            | osascript -l JavaScript native/notes-jxa/notes.js \
            | grep -q '"pong":true'
      - name: Dist server smoke (dynamic module registration)
        run: |
          export APPLE_MCP_CONFIG_DIR=$(mktemp -d)
          node dist/cli/index.js enable calendar --write
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | node dist/src/server.js | grep -q calendar_create_event
      - name: Static injection guard
        run: npm run lint
      - name: Security bottom line (injection suite)
        run: npm run test:injection
      - name: Full test suite
        run: npm test
      - name: Dependency audit
        run: npm run audit
